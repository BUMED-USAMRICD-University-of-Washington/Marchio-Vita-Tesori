<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Sovereign_GI_Tactical_Gloves" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="800px" height="800px" viewBox="0 0 800 800" enable-background="new 0 0 800 800" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED LEATHER MATERIAL CUTTING BOUNDARY (RED LINE) -->
	<!-- Profilo piatto a 5 dita con quote allargate per nocche a soffietto meccanico e splay dita -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M250,650h300l20,-200l60,-150l-40,-50l-50,130
		l-20,-180l-45,-30l-45,180l-20,-200l-45,-25l-45,200l-25,-170l-45,-25l-35,170l-30,-110l-45,20l40,160l65,130Z"/>
	<!-- Cinturino di regolazione perimetrale del polso in pelle CIST -->
	<rect x="280" y="680" fill="none" stroke="#FF0000" stroke-width="2" width="240" height="35" rx="2"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: INTERNAL DOUBLE-NEEDLE SADDLE STITCH CHANNELS (BLUE DASHED LINE) -->
	<!-- Margine di cucitura da 0.25 pollici per l'assemblaggio della pelle da 3.5mm e fodera in bambù -->
	<path fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" d="M265,635h270l15,-185l55,-135
		l-25,-35l-45,115l-20,-165l-30,-20l-35,165l-20,-185l-30,-15l-35,185l-25,-155l-30,-15l-25,155l-25,-95l-30,15l30,145l60,115Z"/>
	<!-- Linee di piega laser per i soffietti articolati sulle nocche (Rinforzo Meccanico) -->
	<path fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="4,2" d="M300,400h200 M300,415h200 M300,430h200"/>
</g>
<g id="Gold_ChiRho_Logo">
	<!-- LAYER 3: TARGET DI RICAMO DEL LOGO MAESTRO (METALLIC GOLD CELLULOSE THREAD) -->
	<!-- La Firma di Dio ricamata ad alta densità sul dorso della mano, sopra la piastra delle nocche -->
	<g transform="translate(0, 240)">
		<path fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" d="
			M370,230l60,60 M430,230l-60,60 M400,305V215 M400,215c12,0,12,18,0,15"/>
	</g>
</g>
</svg>
