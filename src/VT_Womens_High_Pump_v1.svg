<svg xmlns="http://w3.org" viewBox="0 0 1000 700" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Continuous Uninterrupted Incline Silhouette - Wide Zero-Squeeze Toe Box -->
    <path d="M 160,520 L 430,100 L 460,260 L 760,440 C 820,460 860,500 860,520 L 780,520 L 730,340 L 160,520 Z" />
    
    <!-- Wide Graded Toe Box Panel Path -->
    <path d="M 760,440 C 790,460 830,490 860,520" stroke-width="1.5" />
    
    <!-- Outer Heel Pillar Shell Following the Direct Continuous Drop Line -->
    <path d="M 160,520 L 190,440 L 430,100" stroke-width="2" stroke-dasharray="4,2" />
  </g>

  <!-- LAYER 2: INTERNAL CONTINUOUS SHANK MARGINS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- Graded Inset for the Continuous-Ramp 100% Organic Pressed Hemp Shank -->
    <path d="M 175,505 L 418,115 L 448,245 L 738,425 C 780,440 815,480 815,505 Z" />
    
    <!-- Primary Load Target Grid - 100% Force Concentrated at Metatarsal Pad -->
    <ellipse cx="680" cy="410" rx="40" ry="22" stroke-width="2" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered cleanly along the steep continuous incline lining -->
    <path d="M 280,270 L 310,300 M 310,270 L 280,300 M 295,310 L 295,260" />
    <path d="M 295,260 C 307,260 307,275 295,275" stroke-width="6" />
  </g>
</svg>
