<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Womens_Vegan_Stockings" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="600px" height="1000px" viewBox="0 0 600 1000" enable-background="new 0 0 600 1000" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED KNITTING MACHINE BOUNDARY (RED LINE) -->
	<!-- Full-length tapered thigh-high stocking chassis with graded foot profile -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M180,100h240l20,120L380,500l-20,380l120,40
		l20,40H380l-60-60H180l20-400l40-300L180,100Z"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: INTERNAL FRICTION TRACKS & HEEL REINFORCEMENTS (BLUE DASHED LINE) -->
	<!-- Graded 3-inch wide upper thigh cuff boundary containing natural tree rubber ribbing -->
	<rect x="185" y="100" fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" width="230" height="80"/>
	<!-- Internal wavy tracks for liquid tree rubber traction printing -->
	<path fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="4,2" d="M185,130 Q300,110 415,130 M185,150 Q300,130 415,150"/>
	<!-- Metatarsal pad high-impact double-knit cushion matrix target -->
	<ellipse fill="none" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="4,2" cx="440" cy="940" rx="30" ry="15"/>
</g>
<g id="Gold_ChiRho_Logo">
	<!-- LAYER 3: MASTER LOGO EMBROIDERY (METALLIC GOLD CELLULOSE THREAD) -->
	<!-- Placed elegantly on the outer lateral side of the upper thigh cuff banner -->
	<path fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" d="
		M210,125l20,20 M230,125l-20,20 M220,150V115 M220,115c10,0,12,12,0,12"/>
</g>
</svg>
