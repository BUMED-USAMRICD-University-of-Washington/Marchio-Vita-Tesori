<svg xmlns="http://w3.org" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Continuous Uninterrupted Mid-Ramp Incline Silhouette -->
    <path d="M 180,480 L 440,180 L 460,300 L 740,420 C 800,440 840,460 840,480 L 780,480 L 740,360 L 180,480 Z" />
    <!-- Transverse Midfoot Instep Strap Integration Panel -->
    <path d="M 380,180 C 380,240 440,240 440,180" stroke-width="2" />
    <!-- External Structural Heel Post Following the Clean Unbroken Incline Profile -->
    <path d="M 180,480 L 220,410 L 440,180" stroke-width="2" stroke-dasharray="4,2" />
  </g>

  <!-- LAYER 2: INTERNAL CONTINUOUS SHANK MARGINS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- Graded Inset for the Continuous-Ramp 100% Organic Pressed Hemp Shank Core -->
    <path d="M 195,465 L 428,195 L 448,285 L 718,405 C 760,420 795,445 795,465 Z" />
    <!-- High-Impact Plant-Based Forefoot Padding Zone -->
    <ellipse cx="660" cy="390" rx="35" ry="18" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Placed on the instep strap securing buckle zone -->
    <path d="M 400,200 L 420,220 M 420,200 L 400,220 M 410,225 L 410,195" />
  </g>
</svg>
