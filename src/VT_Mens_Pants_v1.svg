<svg xmlns="http://w3.org" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Structured Executive Men's Trouser Cut -->
    <path d="M 220,60 L 580,60 L 610,320 L 540,940 L 430,940 L 400,480 L 370,940 L 260,940 L 190,320 Z" />
    <!-- Permanent Front Pressed Crease Guideline -->
    <path d="M 315,60 L 350,940" stroke="#FF0000" stroke-width="1" stroke-dasharray="4,2" />
    <path d="M 485,60 L 450,940" stroke="#FF0000" stroke-width="1" stroke-dasharray="4,2" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 1 INCH GRADED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 235,75 L 565,75 L 592,315 L 525,925 L 442,925 L 410,495 L 378,925 L 275,925 L 208,315 Z" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered cleanly on the rear waistband belt line above the right pocket -->
    <path d="M 490,90 L 520,120" />
    <path d="M 520,90 L 490,120" />
    <path d="M 505,130 L 505,80" />
    <path d="M 505,80 C 517,80 517,100 505,100" />
  </g>
</svg>
