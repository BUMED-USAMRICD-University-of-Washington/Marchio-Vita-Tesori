<svg xmlns="http://w3.org" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- LAYER 1: FABRIC TEXTILE PROFILE (RED LINE) -->
  <g id="Sash_Textile_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Unfolded horizontal profile of the 350 GSM Bio-Silk/Hemp Waist Sash -->
    <path d="M 50,150 L 1150,150 L 1150,250 L 50,250 Z" />
    <!-- Structural alignment notch for the right hip internal slot pass-through -->
    <path d="M 850,150 L 850,250" stroke-dasharray="4,4" />
  </g>

  <!-- LAYER 2: CONDUCTIVE FLEXIBLE TRACE LINES (SILVER/CYAN PATHS) -->
  <g id="Conductive_Silver_Traces" stroke="#00FFFF" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Parallel data bus lines running along the upper tension spine of the sash -->
    <path d="M 70,175 L 830,175" />
    <path d="M 70,185 L 830,185" />
    <path d="M 70,195 L 830,195" />
    
    <!-- Ground plane trace path weaving down toward the lower hemline -->
    <path d="M 70,225 L 830,225" stroke="#00FF00" stroke-width="2" />
    
    <!-- Strain-relief serpentine wave geometries navigating around the high-stress hip slot area -->
    <path d="M 830,175 C 840,165 860,165 870,175 C 880,185 900,185 910,175 L 1100,175" />
    <path d="M 830,195 C 840,205 860,205 870,195 C 880,185 900,185 910,195 L 1100,195" />
  </g>

  <!-- LAYER 3: SMART MODULE & INTERFACE PADS (METALLIC GOLD) -->
  <g id="Smart_Node_Interface" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linejoin="round">
    <!-- Hardware interface landing zone at the base terminal of the sash (100% Organic Silk Backing) -->
    <rect x="70" y="170" width="20" height="60" rx="3" />
    <circle cx="80" cy="175" r="3" fill="#D4AF37" />
    <circle cx="80" cy="185" r="3" fill="#D4AF37" />
    <circle cx="80" cy="195" r="3" fill="#D4AF37" />
    <circle cx="80" cy="225" r="3" fill="#00FF00" />

    <!-- Terminal sensor landing node located at the far wrapping tail of the belt line -->
    <rect x="1100" y="170" width="30" height="35" rx="5" />
    <!-- Embedded Gold Chi-Rho Logo integrated directly over the data termination trace shield -->
    <g stroke-width="4">
      <path d="M 1110,175 L 1120,195" />
      <path d="M 1120,175 L 1110,195" />
      <path d="M 1115,200 L 1115,170" />
      <path d="M 1115,170 C 1125,170 1125,182 1115,182" />
    </g>
  </g>
</svg>
