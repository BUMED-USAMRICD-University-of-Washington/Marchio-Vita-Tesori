<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- LAYER 1: POCKET FABRIC WALL BOUNDARY (RED LINE) -->
  <g id="Pocket_Fabric_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Asymmetric shielding envelope cut for insertion into the interior shoulder lining -->
    <path d="M 200,150 L 600,150 L 650,250 L 600,650 L 200,650 L 150,250 Z" />
    <!-- Reinforced fold-over top flap hinge line -->
    <path d="M 200,200 L 600,200" stroke-dasharray="6,4" />
  </g>

  <!-- LAYER 2: SERPENTINE PHOTONIC DELAY TRACKS (CYAN OPTIC LINES) -->
  <g id="Photonic_Delay_Tracks" stroke="#00FFFF" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Non-intersecting spiral/serpentine optical loop matrix to maximize delay path length -->
    <path d="M 250,250 L 550,250 C 580,250 580,300 550,300 L 250,300 C 220,300 220,350 250,350 L 550,350 C 580,350 580,400 550,400 L 250,400 C 220,400 220,450 250,450 L 550,450 C 580,450 580,500 550,500 L 250,500 C 220,500 220,550 250,550 L 550,550" />
    
    <!-- Input/Output optical termination nodes at the lower corner boundary -->
    <circle cx="550" cy="550" r="4" fill="#00FFFF" />
    <path d="M 550,550 C 570,550 580,570 580,590 L 580,620" />
    <circle cx="580" cy="620" r="4" fill="#00FFFF" />
  </g>

  <!-- LAYER 3: ANTI-INTERFERENCE GOLD SHIELDING GRID (METALLIC GOLD) -->
  <g id="Gold_Shielding_Grid" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linejoin="round">
    <!-- High-density protective border ring encapsulating the photonic delay architecture -->
    <path d="M 225,225 L 575,225 L 615,300 L 575,625 L 225,625 L 185,300 Z" stroke-width="4" />
    
    <!-- Miniature protective cross-hatch matrices woven over the input/output terminal points -->
    <path d="M 540,580 L 610,580 M 540,600 L 610,600 M 560,560 L 560,630 M 590,560 L 590,630" stroke-width="1" />
    
    <!-- Micro Gold Chi-Rho (☧) Sigil functioning as a ground termination target at the center envelope flap -->
    <g stroke-width="3">
      <path d="M 385,165 L 415,195" />
      <path d="M 415,165 L 385,195" />
      <path d="M 400,160 L 400,200" />
      <path d="M 400,160 C 412,160 412,175 400,175" />
    </g>
  </g>
</svg>
