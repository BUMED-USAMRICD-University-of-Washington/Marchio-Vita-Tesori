<svg xmlns="http://w3.org" viewBox="0 0 800 900" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Straight-Cut Men's Active Taper Duty Shirt Silhouette -->
    <path d="M 260,80 L 540,80 L 620,180 L 740,240 L 680,340 L 580,280 L 580,840 L 220,840 L 220,280 L 120,340 L 60,240 L 180,180 Z" />
    <!-- Asymmetric Overlapping Front Flap Cut (No Synthetic Zippers) -->
    <path d="M 340,80 L 440,280 L 440,840" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 1 INCH REINFORCED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 275,95 L 525,95 L 595,185 L 715,245 L 665,315 L 565,265 L 565,825 L 235,825 L 235,265 L 135,315 L 85,245 L 205,185 Z" />
    <!-- Left and Right Chest Pocket Placement Bounds -->
    <rect x="260" y="360" width="100" height="120" />
    <rect x="440" y="360" width="100" height="120" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered cleanly on the right standing collar wing -->
    <path d="M 480,100 L 510,130 M 510,100 L 480,130 M 495,140 L 495,90" />
    <path d="M 495,90 C 507,90 507,105 495,105" stroke-width="5" />
  </g>
</svg>
