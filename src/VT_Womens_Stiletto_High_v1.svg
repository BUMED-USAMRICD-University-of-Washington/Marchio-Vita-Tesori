<svg xmlns="http://w3.org" viewBox="0 0 1000 700" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Steep Continuous Unbroken Stiletto Incline Silhouette -->
    <path d="M 150,540 L 420,80 L 450,240 L 780,450 C 840,470 880,520 880,540 L 800,540 L 740,320 L 150,540 Z" />
    <!-- High Support Slim Stiletto Heel Pillar Following the Rigid Incline Path -->
    <path d="M 150,540 L 195,440 L 420,80" stroke-width="2" stroke-dasharray="4,2" />
  </g>

  <!-- LAYER 2: INTERNAL CONTINUOUS SHANK MARGINS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- Graded Inset for the Solid Continuous-Ramp Structural Hemp Shank Core -->
    <path d="M 165,525 L 408,95 L 438,225 L 758,435 C 800,450 835,495 835,525 Z" />
    <!-- Extra Graded Padding Support Target Matrix for Metatarsals -->
    <ellipse cx="690" cy="420" rx="42" ry="20" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered cleanly along the interior side wall arch line -->
    <path d="M 310,130 L 340,160 M 340,130 L 310,160 M 325,170 L 325,120" />
  </g>
</svg>
