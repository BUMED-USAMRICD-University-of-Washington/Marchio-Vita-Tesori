<svg xmlns="http://w3.org" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Tailored Women's Executive Dress Shoe Silhouette with Contoured Arch -->
    <path d="M 180,450 L 220,220 C 250,180 300,160 360,160 L 440,160 L 480,280 L 760,400 C 800,420 820,450 820,450 Z" />
    <!-- Sculpted Sweetheart Foot-Bed Opening Wave -->
    <path d="M 360,160 C 440,240 520,280 640,320" stroke="#FF0000" stroke-width="1.5" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 0.5 INCH GRADED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 195,435 L 232,230 C 260,192 305,175 362,175 L 432,175 L 468,285 L 738,398 C 770,415 790,435 790,435 Z" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Positioned cleanly on the interior instep lining -->
    <path d="M 380,200 L 410,230" />
    <path d="M 410,200 L 380,230" />
    <path d="M 395,240 L 395,190" />
    <path d="M 395,190 C 405,190 405,205 395,205" />
  </g>
</svg>
