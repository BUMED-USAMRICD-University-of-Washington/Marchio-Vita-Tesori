<svg xmlns="http://w3.org" viewBox="0 0 800 1200" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Full-Length Women's Tailored Executive Overcoat Silhouette -->
    <path d="M 240,80 L 560,80 L 640,220 L 540,340 L 560,1120 L 240,1120 L 260,340 L 160,220 Z" />
    
    <!-- Deep Overlapping Executive Lapel and Double-Breasted Face Lines -->
    <path d="M 240,80 L 340,300 L 460,300 L 560,80" />
    
    <!-- Integrated Full-Bust Expansion Contours along Princess Seams -->
    <path d="M 290,340 C 270,260 320,200 340,180" stroke="#FF0000" stroke-width="1.5" />
    <path d="M 510,340 C 530,260 480,200 460,180" stroke="#FF0000" stroke-width="1.5" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 1 INCH GRADED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 255,95 L 545,95 L 618,225 L 525,335 L 545,1105 L 255,1105 L 275,335 L 182,225 Z" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered cleanly on the back upper cape/storm flap assembly -->
    <path d="M 380,160 L 420,200" />
    <path d="M 420,160 L 380,200" />
    <path d="M 400,215 L 400,145" />
    <path d="M 400,145 C 415,145 415,175 400,175" />
  </g>
</svg>
