<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Sovereign_Water_Carrier" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="600px" height="800px" viewBox="0 0 600 800" enable-background="new 0 0 600 800" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED LEATHER CUTTING BOUNDARY (RED LINE) -->
	<!-- Cylindrical vertical body sheath paneling -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M150,150h300v450c0,40-40,60-60,60H210
		c-20,0-60-20-60-60V150Z"/>
	<!-- 2.1-Inch Fixed Tunnel Belt Slide Bracket -->
	<rect x="200" y="80" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" width="200" height="52" rx="3"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: DOUBLE-NEEDLE REINFORCED SADDLE STITCHING (BLUE DASHED LINE) -->
	<path fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" d="M165,165h270v425
		c0,30-30,45-45,45H210c-15,0-45-15-45-45V165Z"/>
</g>
<g id="Gold_ChiRho_Logo">
	<!-- LAYER 3: MASTER LOGO EMBROIDERY (METALLIC GOLD CELLULOSE THREAD) -->
	<path fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" d="
		M270,320l60,60 M330,320l-60,60 M300,395V305 M300,305c12,0,12,18,0,15"/>
</g>
</svg>
