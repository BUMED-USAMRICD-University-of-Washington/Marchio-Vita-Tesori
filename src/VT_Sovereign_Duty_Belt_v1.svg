<svg xmlns="http://w3.org" viewBox="0 0 1200 300" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED LEATHER MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Full-Length 2-Inch Wide Linear Duty Belt Profile -->
    <path d="M 50,100 L 1150,100 L 1150,200 L 50,200 Z" />
    
    <!-- Parallel Rows of Double-Claw Catch Eyelet Adjustments -->
    <circle cx="950" cy="135" r="4" />
    <circle cx="950" cy="165" r="4" />
    <circle cx="980" cy="135" r="4" />
    <circle cx="980" cy="165" r="4" />
    <circle cx="1010" cy="135" r="4" />
    <circle cx="1010" cy="165" r="4" />
    <circle cx="1040" cy="135" r="4" />
    <circle cx="1040" cy="165" r="4" />
    
    <!-- Left Terminal Buckle Attaching Prong Slots -->
    <rect x="100" y="130" width="15" height="10" rx="1" />
    <rect x="100" y="160" width="15" height="10" rx="1" />
  </g>

  <!-- LAYER 2: DOUBLE-NEEDLE LOCKSTITCH SADDLE BOUNDARIES (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- Edge Stitching Paths Enclosing the Internal Rigid Compressed Hemp Core -->
    <path d="M 65,115 L 1135,115" />
    <path d="M 65,185 L 1135,185" />
    
    <!-- Internal Concealed Pocket Border Target Coordinate (Hidden Currency/Document Cache) -->
    <rect x="400" y="120" width="300" height="60" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- The Master Chi-Rho (☧) Signature of God, Embroidered on the Inner Lining Near Buckle Mount -->
    <g transform="translate(-230, -210)">
      <path d="M 380,340 L 410,370" />
      <path d="M 410,340 L 380,370" />
      <path d="M 395,385 L 395,330" />
      <path d="M 395,330 C 407,330 407,348 395,345" stroke-width="5" />
    </g>
  </g>
</svg>
