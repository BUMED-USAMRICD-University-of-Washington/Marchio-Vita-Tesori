<svg xmlns="http://w3.org" viewBox="0 0 800 1200" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Broad-Shouldered Men's Corporate Trench Silhouette -->
    <path d="M 200,80 L 600,80 L 660,220 L 560,340 L 580,1120 L 220,1120 L 240,340 L 140,220 Z" />
    
    <!-- Deep Angular Lapels and Double-Breasted Parallel Facing Paths -->
    <path d="M 200,80 L 320,280 L 480,280 L 600,80" />
    <path d="M 340,280 L 340,1120" stroke="#FF0000" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 460,280 L 460,1120" stroke="#FF0000" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 1 INCH GRADED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 215,95 L 585,95 L 638,225 L 545,335 L 565,1105 L 235,1105 L 255,335 L 158,225 Z" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Placed centered directly on the rear back storm flap belt panel -->
    <path d="M 380,180 L 420,220" />
    <path d="M 420,180 L 380,220" />
    <path d="M 400,235 L 400,165" />
    <path d="M 400,165 C 415,165 415,195 400,195" />
  </g>
</svg>
