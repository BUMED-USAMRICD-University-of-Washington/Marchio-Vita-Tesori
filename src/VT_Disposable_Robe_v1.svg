<svg xmlns="http://w3.org" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Simplified Full-Coverage Cleanroom Style Utility Robe Panel -->
    <path d="M 280,60 L 520,60 L 600,160 L 720,220 L 660,320 L 560,260 L 560,940 L 240,940 L 240,260 L 140,320 L 80,220 L 200,160 Z" />
    <!-- Overlapping front split panel for rapid tear-away removal -->
    <path d="M 400,60 L 400,940" stroke-dasharray="4,4" />
  </g>

  <!-- LAYER 2: SIMPLIFIED PRODUCTION GLUE/WELD LINES (BLUE DASHED LINE) -->
  <g id="Assembly_Margins" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- Minimalist 0.5-inch margins optimized for high-speed ultrasonic textile welding or non-toxic starch glue bonding -->
    <path d="M 290,75 L 510,75 L 585,170 L 700,225 L 650,305 L 545,250 L 545,925 L 255,925 L 255,250 L 150,305 L 100,225 L 215,170 Z" />
  </g>

  <!-- LAYER 3: AUTOMATED INK PRINT LAYOUT (METALLIC GOLD) -->
  <g id="Gold_Print_Logo" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered on the left breast area for swift identification -->
    <path d="M 320,140 L 360,200" />
    <path d="M 360,140 L 320,200" />
    <path d="M 340,215 L 340,120" />
    <path d="M 340,120 C 365,120 365,155 340,155" />
  </g>
</svg>
