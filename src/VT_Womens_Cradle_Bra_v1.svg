	<path fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" d="M315,135h170l35,115l65,135
		l-45,120H260l-45-120l65-135L315,135Z"/>
</g>
<g id="Embroidered_Hand_Placements">
	<!-- LAYER 3: INNER-FACING TEXTURED HAND RICAMO TARGETS (METALLIC GOLD CELLULOSE THREAD) -->
	<!-- Left and Right Lifting Hands mapped over inner lining cups with raised metatarsal nodes -->
	<path fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M240,420 Q300,480 360,400 T400,280"/>
	<path fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M560,420 Q500,480 440,400 T400,280"/>
</g>
</svg>
