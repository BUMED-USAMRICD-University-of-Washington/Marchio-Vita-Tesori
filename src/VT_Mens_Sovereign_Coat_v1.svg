<svg xmlns="http://w3.org" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Structured, Broad-Shouldered Double-Breasted Long Coat Silhouette -->
    <path d="M 220,100 L 580,100 L 640,220 L 560,320 L 500,260 L 500,900 L 300,900 L 300,260 L 240,320 L 160,220 Z" />
    <!-- Asymmetric Overlapping Front Chest Plate Seam -->
