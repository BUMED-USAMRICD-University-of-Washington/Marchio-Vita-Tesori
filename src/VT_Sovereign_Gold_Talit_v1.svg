<svg xmlns="http://w3.org" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED PLANT FABRIC CUTMENT BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Traditional Rectangular Talit Mantle Panel (Scaled Dimensions) -->
    <rect x="50" y="50" width="1100" height="700" rx="2" />
    
    <!-- Four Corner Square Structural Patches for Tzitzit Reinforcement Loops -->
    <rect x="50" y="50" width="80" height="80" />
    <rect x="1070" y="50" width="80" height="80" />
    <rect x="50" y="670" width="80" height="80" />
    <rect x="1070" y="670" width="80" height="80" />
  </g>

  <!-- LAYER 2: SEAM ALLOWANCE & TRADITIONAL STRIPE ALIGNMENTS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- 0.75-Inch Internal Fold-Under Hem Margin for Open-Weave Gauze -->
    <rect x="70" y="70" width="1060" height="660" />
    
    <!-- Symmetrical Parallel Calibration Paths for the Traditional Stripe Bands -->
    <path d="M 180,70 L 180,730 M 200,70 L 200,730 M 240,70 L 240,730" />
    <path d="M 1020,70 L 1020,730 M 1000,70 L 1000,730 M 960,70 L 960,730" />
  </g>

  <!-- LAYER 3: 24K ACTUAL GOLD THREAD HIGH-DENSITY EMBROIDERY (METALLIC GOLD) -->
  <g id="Actual_24K_Gold_Tracks" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- The Atarah (Crown) Collar Band Header Panel - Centered Upper Edge -->
    <rect x="350" y="70" width="500" height="60" stroke-width="2" />
    
    <!-- Central Crown Crown Signature of God: The Chi-Rho (☧) Monogram from Master File -->
    <g transform="translate(150, -295)" stroke-width="10">
      <path d="M 425,410 L 475,460" />
      <path d="M 475,410 L 425,460" />
      <path d="M 450,475 L 450,380" />
      <path d="M 450,380 C 480,380 480,425 450,425" />
    </g>

    <!-- Heavy 24K Solid Satin Bands filling the parallel stripe segments -->
    <path d="M 190,70 L 190,730" stroke-width="12" />
    <path d="M 220,70 L 220,730" stroke-width="24" />
    <path d="M 1010,70 L 1010,730" stroke-width="12" />
    <path d="M 980,70 L 980,730" stroke-width="24" />
    
    <!-- Corner Eyelet Reinforcement Ring Borders for Tzitzit Tie Nodes -->
    <circle cx="90" cy="90" r="10" stroke-width="4" />
    <circle cx="1110" cy="90" r="10" stroke-width="4" />
    <circle cx="90" cy="710" r="10" stroke-width="4" />
    <circle cx="1110" cy="710" r="10" stroke-width="4" />
  </g>
</svg>
