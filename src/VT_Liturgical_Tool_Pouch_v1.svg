<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Liturgical_Tool_Pouch" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="800px" height="700px" viewBox="0 0 800 700" enable-background="new 0 0 800 700" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED LEATHER CUTTING BOUNDARY (RED LINE) -->
	<rect x="100" y="120" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" width="600" height="450" rx="6"/>
	<!-- Internal Rigid Compartment Vertical Divider Cuts -->
	<path fill="none" stroke="#FF0000" stroke-width="1.5" stroke-miterlimit="10" d="M300,120v450 M500,120v450"/>
	<!-- Dual 2.1-Inch Reverse Mounted Belt Loops -->
	<rect x="180" y="50" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" width="80" height="50" rx="2"/>
	<rect x="540" y="50" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" width="80" height="50" rx="2"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: DOUBLE-NEEDLE SADDLE ASSEMBLY MARGINS (BLUE DASHED LINE) -->
	<rect x="120" y="140" fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" width="560" height="410"/>
</g>
<g id="Gold_ChiRho_Logo">
	<!-- LAYER 3: MASTER LOGO EMBROIDERY (METALLIC GOLD CELLULOSE THREAD) -->
	<path fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" d="
		M370,310l60,60 M430,310l-60,60 M400,385V295 M400,295c12,0,12,18,0,15"/>
</g>
