	 width="1000px" height="850px" viewBox="0 0 1000 850" enable-background="new 0 0 1000 850" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LIVELLO 1: LINEA DI FUSIONE ORO 24K E TAGLIO CHASSIS (LINEA ROSSA) -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M120,620 L480,60l40,160l280,240c60,20,100,70,100,90
		H760l-60-250L120,620Z"/>
	<path fill="none" stroke="#FF0000" stroke-width="1.5" stroke-miterlimit="10" d="M760,460c30,25,70,60,100,100"/>
	<!-- Canale di Passaggio per il Cinturino alla Caviglia in Pelle CIST -->
	<rect x="200" y="420" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" width="20" height="60" rx="2"/>
</g>
<g id="Seam_Allowance">
