		l262,220c38,15,67,52,67,77H785l-57-230Z"/>
	<ellipse fill="none" stroke="#0000FF" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6,4" cx="720" cy="480" rx="45" ry="20"/>
</g>
<g id="Gold_ChiRho_Logo">
