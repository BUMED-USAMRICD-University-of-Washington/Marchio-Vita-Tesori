    <path d="M 550,200 L 650,200 L 680,300 L 600,350 L 520,300 Z" />
    
    <!-- Dual-Flank Left and Right Mirror Weapon Pocket Blanks -->
    <path d="M 150,450 L 350,450 L 300,850 L 200,850 Z" />
    <path d="M 1050,450 L 850,450 L 900,850 L 1000,850 Z" />
    
