<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Sovereign_Cuff_Holder" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="600px" height="600px" viewBox="0 0 600 600" enable-background="new 0 0 600 600" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED LEATHER CUTTING BOUNDARY (RED LINE) -->
	<!-- Boxy, rounded corner envelope cut for standard dual cuffs -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M180,120h240v300c0,20-20,40-40,40H220
		c-20,0-40-20-40-40V120Z"/>
	<!-- Integrated 2.1-Inch High-Stability Belt Tunnel Loop (Rear Panel Backing) -->
	<rect x="220" y="60" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" width="160" height="50" rx="4"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: DOUBLE-NEEDLE REINFORCED SADDLE STITCHING (BLUE DASHED LINE) -->
	<!-- Graded 0.5-inch edge stitch buffer lines to bind 4mm thick CIST biological leather -->
	<path fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" d="M195,135h210v275
		c0,15-15,25-25,25H220c-10,0-25-10-25-25V135Z"/>
</g>
<g id="Gold_ChiRho_Logo">
	<!-- LAYER 3: MASTER LOGO EMBROIDERY (METALLIC GOLD CELLULOSE THREAD) -->
	<path fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" d="
		M270,220l60,60 M330,220l-60,60 M300,295V205 M300,205c12,0,12,18,0,15"/>
</g>
</svg>
