		l-25,-35l-40,105l-20,-155l-25,-15l-30,155l-20,-175l-25,-10l-30,175l-25,-145l-25,-10l-20,145l-20,-85l-25,10l25,135l55,105Z"/>
</g>
<g id="Embroidered_Hand_Placements">
