	<path fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M290,450 Q350,510 410,430 T450,310"/>
	<path fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M320,420 Q370,470 420,400 T440,300"/>
	<path fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M350,390 Q390,440 430,370 T430,290"/>
	<!-- Mapped raised callus padding targets matching your exact master scan coordinates -->
	<ellipse fill="none" stroke="#D4AF37" stroke-width="3" cx="350" cy="460" rx="18" ry="8"/>
</g>
</svg>
