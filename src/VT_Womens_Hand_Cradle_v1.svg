<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Womens_Hand_Cradle_Gloves" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="800px" height="800px" viewBox="0 0 800 800" enable-background="new 0 0 800 800" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
	<!-- Form-fitting, streamlined hand stocking chassis designed to fit snug beneath outer duty gear -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M260,630h280l15,-180l55,-140l-35,-45l-45,115
		l-20,-165l-30,-20l-30,165l-20,-185l-30,-15l-35,185l-25,-155l-30,-15l-25,155l-25,-95l-30,15l30,145l60,115Z"/>
</g>
<g id="Seam_Allowance">
