<svg xmlns="http://w3.org" viewBox="0 0 1000 1200" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED LEATHER MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Tall, Broad-Base Designer Tactical Rucksack Profile -->
    <path d="M 250,100 L 750,100 L 800,300 L 800,1050 L 200,1050 L 200,300 Z" />
    <!-- Vertical Executive Structural Accent Creases Woven into Leather Face -->
    <path d="M 380,100 L 380,1050 M 620,100 L 620,1050" stroke-dasharray="10,5" />
    <!-- Dual Front Flap Straps (CIST Vegetable-Tanned Hides) -->
    <rect x="330" y="300" width="30" height="400" />
    <rect x="640" y="300" width="30" height="400" />
  </g>

  <!-- LAYER 2: HEAVY DUTY BASE ASSEMBLY STITCH CHANNELS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 265,115 L 735,115 L 785,310 L 785,1035 L 215,1035 L 215,310 Z" />
  </g>

  <!-- LAYER 3: 24K GOLD CELLULOSE THREAD SEWING TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Prominently displayed over the main upper enclosure shield -->
    <path d="M 470,180 L 530,240 M 530,180 L 470,240 M 500,255 L 500,165" />
    <path d="M 500,165 C 515,165 515,195 500,192" stroke-width="6" />
  </g>
</svg>
