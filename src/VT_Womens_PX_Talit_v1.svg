<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Womens_PX_Talit" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="1200px" height="800px" viewBox="0 0 1200 800" enable-background="new 0 0 1200 800" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED PLANT FABRIC CUTTING BOUNDARY (RED LINE) -->
	<rect x="50" y="50" width="1100" height="700" rx="2" fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10"/>
	<!-- Four Corner Reinforcement Blocks for Tzitzit Eyelets -->
	<rect x="50" y="50" width="80" height="80" fill="none" stroke="#FF0000" stroke-width="1.5"/>
	<rect x="1070" y="50" width="80" height="80" fill="none" stroke="#FF0000" stroke-width="1.5"/>
	<rect x="50" y="670" width="80" height="80" fill="none" stroke="#FF0000" stroke-width="1.5"/>
	<rect x="1070" y="670" width="80" height="80" fill="none" stroke="#FF0000" stroke-width="1.5"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: INTERNAL FOLD-UNDER HEM & EMBROIDERY ZONING (BLUE DASHED LINE) -->
	<rect x="70" y="70" width="1060" height="660" fill="none" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4"/>
</g>
<g id="Exterior_PX_Logo">
	<!-- LAYER 3A: OUTWARD-FACING BRANDING LAYER (PANTONE 16-0947 TCX GOLD EARTH) -->
	<!-- The Department PX Logo aligned center-top over the Atarah collar mantle -->
	<g transform="translate(150, -295)" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
		<path d="M 410,410 L 490,490 M 490,410 L 410,490 M 450,510 L 450,370" />
		<path d="M 450,370 C 495,370 495,430 450,430" stroke-width="12" />
	</g>
</g>
<g id="Interior_Cradle_Hands" data-production-layer="Inner_Facing_Lining">
	<!-- LAYER 3B: INWARD-FACING COMFORT CHANNEL (SOFT COTTON MATTE THREAD) -->
	<!-- Mirroring support hands positioned on the interior shoulder yoke drape to press against skin -->
	<path fill="none" stroke="#606060" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2" d="M380,250 c30-15,60-10,70,20 M400,230 c25-10,50-5,55,15 M420,210 c20-10,40,0,40,20"/>
	<path fill="none" stroke="#606060" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2" d="M820,250 c-30-15-60-10-70,20 M800,230 c-25-10-50-5-55,15 M780,210 c-20-10-40,0-40,20"/>
</g>
</svg>
