<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://w3.org">
<svg version="1.1" id="Womens_Companion_Sit_Stockings" xmlns="http://w3.org" xmlns:xlink="http://w3.org" x="0px" y="0px"
	 width="800px" height="1000px" viewBox="0 0 800 1000" enable-background="new 0 0 800 1000" xml:space="preserve">
<g id="Cutting_Boundary">
	<!-- LAYER 1: AUTOMATED CIRKULAR KNITTING BOUNDARY (RED LINE) -->
	<!-- Left and Right Thigh-High Stocking Panel Layouts Graded for Knee Alignment -->
	<!-- LEFT LEG PANEL -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M100,100h200l20,120L280,500l-20,380l120,40v40H220 L160,900H100l20-400l40-300L100,100Z"/>
	<!-- RIGHT LEG PANEL -->
	<path fill="none" stroke="#FF0000" stroke-width="2" stroke-miterlimit="10" d="M500,100h200l20,120L680,500l-20,380l120,40v40H620 L560,900H500l20-400l40-300L500,100Z"/>
</g>
<g id="Seam_Allowance">
	<!-- LAYER 2: INTERNAL FLATLOCK ASSEMBLY MARGINS & ANTI-SLIP TRACKS (BLUE DASHED LINE) -->
	<!-- Wide upper thigh cuffs containing concentric internal bands of natural tree sap latex grip -->
	<rect x="105" y="100" fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" width="190" height="80"/>
	<path fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="4,2" d="M105,130 Q200,110 295,130 M105,150 Q200,130 295,150"/>
	
	<rect x="505" y="100" fill="none" stroke="#0000FF" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6,4" width="190" height="80"/>
	<path fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="4,2" d="M505,130 Q600,110 695,130 M505,150 Q600,130 695,150"/>
</g>
<g id="Embroidered_Hand_Placements">
	<!-- LAYER 3: INNER-FACING TEXTURED HAND RICAMO TARGETS (METALLIC GOLD CELLULOSE THREAD) -->
	<!-- LEFT STOCKING: Right Hand Matrix wrapping patella from left neighbor vector -->
	<path fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M160,400 c30-15,60-10,70,20 M180,380 c25-10,50-5,55,15 M200,360 c20-10,40,0,40,20 M220,340 c15-5,30,5,30,15"/>
	<ellipse fill="none" stroke="#D4AF37" stroke-width="3" cx="170" cy="420" rx="15" ry="7"/>

	<!-- RIGHT STOCKING: Left Hand Matrix wrapping patella from right neighbor vector -->
	<path fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M640,400 c-30-15-60-10-70,20 M620,380 c-25-10-50-5-55,15 M600,360 c-20-10-40,0-40,20 M580,340 c-15-5-30,5-30,15"/>
	<ellipse fill="none" stroke="#D4AF37" stroke-width="3" cx="630" cy="420" rx="15" ry="7"/>
</g>
</svg>
