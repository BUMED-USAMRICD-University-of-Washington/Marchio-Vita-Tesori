<svg xmlns="http://w3.org" viewBox="0 0 1000 650" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED BIOLOGICAL MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Continuous Uninterrupted True-Ramp Boat Shoe Silhouette with Wide Toe Box -->
    <path d="M 160,480 L 440,140 L 460,260 L 760,380 C 820,400 860,440 860,460 L 780,460 L 730,320 L 160,480 Z" />
    
    <!-- Traditional Moc-Toe Top Apron Panel Slicing Path -->
    <path d="M 460,260 C 500,280 660,320 760,380 L 710,440 C 630,400 490,360 430,340 Z" />
    
    <!-- 360-Degree CIST Leather Strap Eyelet Coordination Points -->
    <circle cx="220" cy="420" r="6" />
    <circle cx="280" cy="360" r="6" />
    <circle cx="340" cy="300" r="6" />
    <circle cx="400" cy="240" r="6" />
  </g>

  <!-- LAYER 2: INTERNAL CONTINUOUS SHANK & DECK SIPING MARGINS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- Graded Inset for the Solid Continuous-Ramp Structural Hemp Shank Core -->
    <path d="M 175,465 L 428,155 L 448,245 L 738,365 C 770,385 795,425 795,445 Z" />
    
    <!-- Wavy Wet-Deck Siping Line Paths Along the Natural Tree Rubber Soling Layer -->
    <path d="M 160,490 Q 440,430 860,470 M 160,500 Q 440,440 860,480" stroke="#00FFFF" stroke-width="1" />
    
    <!-- Primary Load Target Grid - 100% Force Concentrated at Metatarsal Pad -->
    <ellipse cx="660" cy="370" rx="40" ry="20" stroke-width="1" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- The Master Chi-Rho (☧) Monogram Centered Cleanly on the Exterior Tongue Panel -->
    <g transform="translate(10, 50)">
      <path d="M 425,210 L 455,240" />
      <path d="M 455,210 L 425,240" />
      <path d="M 440,250 L 440,200" />
      <path d="M 440,200 C 452,200 452,218 440,215" stroke-width="5" />
    </g>
  </g>
</svg>
