<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Tailored Women's Vest Silhouette with Low V-Neck and Sculpted Waist -->
    <path d="M 280,100 L 520,100 L 580,220 L 520,350 L 520,680 L 280,680 L 280,350 L 220,220 Z" />
    
    <!-- 3D Bustier Contoured Sweetheart Overlay Panel Seams -->
    <path d="M 320,100 C 350,260 450,260 480,100" />
    <path d="M 220,220 C 300,280 500,280 580,220" />
    
    <!-- Architectural Princess Darts for Full-Bust Expansion Support -->
    <path d="M 340,300 C 340,240 370,220 370,200" stroke="#FF0000" stroke-width="1.5" />
    <path d="M 460,300 C 460,240 430,220 430,200" stroke="#FF0000" stroke-width="1.5" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 1 INCH GRADED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 295,115 L 505,115 L 562,225 L 505,345 L 505,665 L 295,665 L 295,345 L 238,225 Z" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
