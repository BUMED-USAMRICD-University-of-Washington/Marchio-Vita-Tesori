    <!-- Centered perfectly on the back neck label region -->
    <path d="M 380,130 L 420,170" />
    <path d="M 420,130 L 380,170" />
    <path d="M 400,185 L 400,115" />
    <path d="M 400,115 C 415,115 415,145 400,145" />
  </g>
</svg>
