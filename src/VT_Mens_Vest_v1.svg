<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED FABRIC CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Straight-Cut Men's Corporate Vest with Pointed Front Hems -->
    <path d="M 260,100 L 540,100 L 600,240 L 540,360 L 540,650 L 400,720 L 260,650 L 260,360 L 200,240 Z" />
    
    <!-- Double-Breasted Parallel Button Alignment Layout Markers -->
    <path d="M 330,100 L 330,650" stroke="#FF0000" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 470,100 L 470,650" stroke="#FF0000" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE - 1 INCH GRADED (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 275,115 L 525,115 L 582,245 L 525,355 L 525,640 L 400,700 L 275,640 L 275,355 L 218,245 Z" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Placed cleanly over the left lower welt faux-pocket line -->
    <path d="M 290,530 L 320,560" />
    <path d="M 320,530 L 290,560" />
    <path d="M 305,570 L 305,520" />
    <path d="M 305,520 C 317,520 317,540 305,540" />
  </g>
</svg>
