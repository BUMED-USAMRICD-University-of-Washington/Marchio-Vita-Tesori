<svg xmlns="http://w3.org" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED BIOLOGICAL MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Low-Profile, Wide-Toe Men's Classic Boat Shoe Silhouette -->
    <path d="M 120,420 L 160,260 C 190,200 240,180 320,180 L 460,180 L 480,260 L 760,360 C 820,380 860,420 860,420 Z" />
    
    <!-- Traditional Moc-Toe Top Apron Panel Slicing Path -->
    <path d="M 480,260 C 520,280 680,320 760,360 L 720,420 C 640,380 500,340 440,320 Z" />
    
    <!-- Continuous 360-Degree CIST Leather Strap Threading Path (Collar Eyelets) -->
    <circle cx="200" cy="220" r="6" />
    <circle cx="260" cy="200" r="6" />
    <circle cx="320" cy="190" r="6" />
    <circle cx="380" cy="185" r="6" />
  </g>

  <!-- LAYER 2: INTERNAL SEAM ALLOWANCE & REINFORCEMENT MARGINS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <!-- 0.5-Inch Graded Assembly Border for Heavy Tanned Cowhide Panels -->
    <path d="M 135,405 L 172,265 C 200,212 245,195 322,195 L 448,195 L 465,265 L 738,358 C 780,375 815,405 815,405 Z" />
    
    <!-- Siped Vulcanized Natural Tree Rubber Outsole Tread Layout (Wavy Deck Siping) -->
    <path d="M 120,430 Q 300,410 860,430 M 120,440 Q 300,420 860,440" stroke="#00FFFF" stroke-width="1" />
  </g>

  <!-- LAYER 3: CELLULOSE GOLD THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- The Master Chi-Rho (☧) Monogram Centered Cleanly on the Exterior Tongue Tongue Flap -->
    <g transform="translate(20, -10)">
      <path d="M 435,210 L 465,240" />
      <path d="M 465,210 L 435,240" />
      <path d="M 450,250 L 450,200" />
      <path d="M 450,200 C 462,200 462,218 450,215" stroke-width="5" />
    </g>
  </g>
</svg>
