<svg xmlns="http://w3.org" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- LAYER 1: AUTOMATED MATERIAL CUTTING BOUNDARY (RED LINE) -->
  <g id="Cutting_Boundary" stroke="#FF0000" stroke-width="2" fill="none">
    <!-- Classic Boxy Flight Jacket Body Profile with Wide Sleeves -->
    <path d="M 280,100 L 720,100 L 820,250 L 740,380 L 680,320 L 680,850 L 320,850 L 320,320 L 260,380 L 180,250 Z" />
    <!-- Overlapping Front Wind Flap Isolation Path -->
    <path d="M 440,100 L 440,850" />
    <!-- Gusseted Underarm Expanders for Broad Tactical Reach -->
    <path d="M 260,380 C 300,320 320,320 320,350" />
    <path d="M 740,380 C 700,320 680,320 680,350" />
  </g>

  <!-- LAYER 2: DOUBLE-NEEDLE SADDLE ASSEMBLY STITCH MARGINS (BLUE DASHED LINE) -->
  <g id="Seam_Allowance" stroke="#0000FF" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 295,115 L 705,115 L 802,255 L 725,365 L 665,305 L 665,835 L 335,835 L 335,305 L 275,365 L 198,255 Z" />
    <!-- Left and Right Flap-Closure Utility Flight Pockets -->
    <rect x="360" y="450" width="110" height="140" />
    <rect x="530" y="450" width="110" height="140" />
  </g>

  <!-- LAYER 3: 24K GOLD CELLULOSE THREAD EMBROIDERY TARGET (METALLIC GOLD) -->
  <g id="Gold_ChiRho_Logo" fill="none" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centered cleanly on the upper leather back storm shield yoke -->
    <path d="M 470,160 L 530,220 M 530,160 L 470,220 M 500,235 L 500,145" />
    <path d="M 500,165 C 515,165 515,195 500,192" stroke-width="6" />
  </g>
</svg>
