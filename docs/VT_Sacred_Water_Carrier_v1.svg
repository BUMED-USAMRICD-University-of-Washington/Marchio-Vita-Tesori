The Sovereign Sacred Water & Flask Carrier (`VT_Sacred_Water_Carrier_v1.svg`)

-   **Design Framework:** A vertical cylindrical basket carrier designed to cradle holy water flasks or standard hydration vessels securely. It uses an open-front leather cradle design that allows the vessel's weight to lock flat against the hip, paired with a top retention thong made of vegetable-tanned leather to keep the container stationary while running.
